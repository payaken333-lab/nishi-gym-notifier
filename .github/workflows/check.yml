name: 体育館空き状況チェック

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nishi-gym-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: チェック実行
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python checker.py

      - name: 既読状態の保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_slots.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update seen slots"
            for i in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                echo "保存成功"
                break
              fi
              echo "競合が発生したためリトライします ($i回目)"
              git rebase --abort || true
              sleep $((RANDOM % 5 + 1))
            done
          fi

